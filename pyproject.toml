[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rbi-sebi-agent"
version = "0.1.0"
description = "Evidence-first circular research with reproducible evaluations"
requires-python = ">=3.11,<3.14"
dependencies = ["langgraph>=1,<2", "pydantic>=2.10,<3", "numpy>=2,<3", "rank-bm25==0.2.2", "pymupdf>=1.26,<2"]

[project.optional-dependencies]
retrieval = ["sentence-transformers>=5,<6", "faiss-cpu>=1.12,<2"]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
include = ["src*", "evals*", "redteam*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
